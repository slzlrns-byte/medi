# 낱알식별 데이터(pill_catalog.json)를 식약처 공공데이터에서 받아 커밋한다.
#
# 손으로만 돌린다(workflow_dispatch). 데이터가 바뀌는 일은 드물고,
# 공공 API 를 스케줄로 두드릴 이유가 없다.
#
# 먼저 필요한 것: 공공데이터포털(data.go.kr)에서 "의약품 낱알식별 정보"
# 활용신청 → 일반 인증키(Decoding) → 저장소 시크릿 MFDS_SERVICE_KEY 로 저장.
name: Pill catalog

# workflow_dispatch 는 기본 브랜치에 있어야 등록된다. 작업 브랜치에서 돌릴 수
# 있게 화면 찍기와 같은 방식을 쓴다 - 이 파일을 건드린 푸시에만 돈다.
# 실행 기록: 2026-09-15 1차 (MFDS_SERVICE_KEY 등록 직후)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pill-catalog.yml
      - scripts/build_pill_catalog.py

concurrency:
  group: pill-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 낱알 데이터 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 식약처 데이터 받아 추리기
        env:
          MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY }}
        run: python3 scripts/build_pill_catalog.py

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet; then
            echo "pill_catalog.json 에 변화 없음 - 커밋하지 않는다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/JanjanCore/Sources/JanjanCore/Resources/pill_catalog.json
          git commit -m "낱알 데이터 갱신 (식약처 의약품 낱알식별 정보, 공공누리 제1유형)"
          git push
