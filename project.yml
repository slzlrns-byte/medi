# 더잔잔 (The Janjan) — XcodeGen 스펙
#
#   xcodegen generate    →  TheJanjan.xcodeproj
#
# .xcodeproj 는 절대 커밋하지 않는다(.gitignore). 프로젝트 구조를 바꿀 일이 있으면
# 이 파일만 고치고 다시 생성한다. 맥 없이 GitHub Actions 에서만 빌드하므로,
# 여기 적힌 경로에 실제로 파일이 있어야 CI 가 통과한다.

name: TheJanjan

options:
  bundleIdPrefix: com.thejanjan
  createIntermediateGroups: true
  developmentLanguage: ko
  generateEmptyDirectories: false
  groupSortPosition: top
  xcodeVersion: "15.4"
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

configs:
  Debug: debug
  Release: release

packages:
  JanjanCore:
    path: Packages/JanjanCore

# ── 공통 빌드 설정 ────────────────────────────────────────────────────────
# DEVELOPMENT_TEAM 은 일부러 비워 둔다. XcodeGen 은 ${ENV} 치환을 지원하지 않으므로
# fastlane(update_code_signing_settings) / xcodebuild 인자로 주입한다.
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      # 개발 빌드는 development APS 환경. Release 는 production 이어야
      # App Store 프로파일과 entitlement 가 어긋나지 않는다.
      APS_ENVIRONMENT: development
    Release:
      CODE_SIGN_STYLE: Manual
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
      VALIDATE_PRODUCT: YES
      APS_ENVIRONMENT: production

targets:
  # ── iOS 앱 ────────────────────────────────────────────────────────────
  TheJanjan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TheJanjan
        excludes:
          - "TheJanjan.entitlements"
          - "PrivacyInfo.xcprivacy"
          - "Configuration/Janjan.storekit"
      - path: TheJanjan/TheJanjan.entitlements
        buildPhase: none
      # StoreKit 설정 파일은 시뮬레이터에서 구독을 눌러 보기 위한 것이다.
      # 앱 번들에는 들어가면 안 되므로 폴더 스캔에서 제외하고 buildPhase: none 으로만 넣는다.
      - path: TheJanjan/Configuration/Janjan.storekit
        buildPhase: none
      # 개인정보 매니페스트는 번들에 들어가야 한다(리소스). 폴더 통째로 넣으면
      # 두 번 등록되어 "Multiple commands produce" 가 나므로 위에서 제외하고 여기서만 넣는다.
      # 워치 타깃은 UserDefaults·파일 API 를 직접 쓰지 않아 아직 매니페스트가 없다.
      - path: TheJanjan/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: JanjanCore
      - target: TheJanjanWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
      - target: TheJanjanWidgets
        embed: true
    info:
      path: TheJanjan/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "더잔잔"
        CFBundleDevelopmentRegion: "ko"
        CFBundlePackageType: "APPL"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "약봉투의 약 이름을 읽어 등록을 도와드려요. 사진은 저장되지 않습니다."
        # 카메라가 없는 기기에서는 앨범에서 고르게 떨어진다. 그 경로도 문구가 있어야 한다.
        NSPhotoLibraryUsageDescription: "약봉투 사진에서 약 이름을 읽어 등록을 도와드려요. 사진은 저장되지 않습니다."
        NSFaceIDUsageDescription: "앱 잠금을 해제할 때만 Face ID를 사용합니다. 기록은 기기 밖으로 나가지 않습니다."
        UIAppFonts:
          - "SUIT-Light.otf"
          - "SUIT-Regular.otf"
          - "Pretendard-Light.otf"
          - "Pretendard-Regular.otf"
          - "Pretendard-Medium.otf"
          - "Pretendard-SemiBold.otf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejanjan.app
        PRODUCT_NAME: TheJanjan
        # 아이폰 전용. 아이패드는 확대 모드로 돈다(심사 체크리스트 4.5).
        # "1,2" 로 두면 아이패드 네이티브로 올라가는데, 그 레이아웃은 만들지도
        # 확인하지도 않았다 — 심사에서 그대로 걸린다.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # entitlements 는 Debug/Release 양쪽에 반드시 연결한다.
        # (한쪽에만 붙어 있어 아카이브에서만 iCloud 가 빠지는 사고를 겪은 적 있음)
        CODE_SIGN_ENTITLEMENTS: TheJanjan/TheJanjan.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TheJanjan/TheJanjan.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TheJanjan/TheJanjan.entitlements
    scheme:
      testTargets:
        - TheJanjanTests
      gatherCoverageData: true
      # 시뮬레이터에서 실제로 구매 흐름을 눌러 볼 수 있게 로컬 StoreKit 설정을 연결한다.
      # 이 값은 Xcode 스킴(Run)에만 들어가고, 아카이브·TestFlight 빌드와는 무관하다.
      # StoreKit 2 구독에는 별도 entitlement 가 필요 없다(In-App Purchase 는 자동).
      storeKitConfiguration: TheJanjan/Configuration/Janjan.storekit
      # 시뮬레이터에는 iCloud 계정도 entitlement 도 없다. CloudKit 셋업을 아예 건너뛰어
      # 테스트가 저장소 문제로 흔들리지 않게 한다. 이 값은 Xcode 가 프로세스를 띄울 때만
      # 적용되므로 TestFlight/기기 설치본에는 아무 영향이 없다.
      environmentVariables:
        JANJAN_DISABLE_CLOUDKIT: "1"

  # ── watchOS 앱 (단일 타깃, iOS 앱에 임베드) ─────────────────────────────
  # ── 위젯 (홈 화면 · 잠금화면) ──────────────────────────────────────────
  # 앱을 열지 않고 한 번에 기록하기 위한 것이다. 그래서 익스텐션이 앱과 **같은
  # 저장소**(App Group)를 직접 열고 그 자리에서 적는다. 앱이 켜질 때까지 미뤄 두면
  # 앱을 안 여는 날의 기록이 늦거나 사라진다.
  #
  # Persistence 와 Shared 를 함께 컴파일한다. 둘 다 Foundation·SwiftData·JanjanCore
  # 만 쓰므로 익스텐션에서도 그대로 돈다. 계산을 한 벌 더 쓰지 않는 것이 요점이다 -
  # 화면과 위젯이 서로 다른 숫자를 말하면 안 된다.
  TheJanjanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TheJanjanWidgets
        excludes:
          - "TheJanjanWidgets.entitlements"
      - path: TheJanjanWidgets/TheJanjanWidgets.entitlements
        buildPhase: none
      # 폴더째 넣지 않고 세 파일만 이름으로 넣는다.
      #
      # 폴더로 넣었다가 MedicationStore 가 딸려 들어와 깨졌다. 그 파일은
      # NotificationManager 를 부르는데 알림 코드는 앱에만 있다. 제외 목록으로
      # 막으면 Persistence 에 새 파일이 생길 때마다 위젯 빌드가 조용히 깨지고,
      # 그 파일을 쓴 사람은 위젯을 건드린 적도 없다. 필요한 것만 적는 쪽이
      # 늘어나는 제외 목록보다 안전하다.
      #
      # 셋 다 Persistence 안의 다른 파일을 부르지 않는다(확인함).
      - path: TheJanjan/Persistence/Records.swift
      - path: TheJanjan/Persistence/JanjanModelContainer.swift
      - path: TheJanjan/Persistence/DoseRecorder.swift
      - path: TheJanjan/Shared
    dependencies:
      - package: JanjanCore
    info:
      path: TheJanjanWidgets/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "더잔잔"
        CFBundleDevelopmentRegion: "ko"
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejanjan.app.widgets
        PRODUCT_NAME: TheJanjanWidgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: TheJanjanWidgets/TheJanjanWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TheJanjanWidgets/TheJanjanWidgets.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TheJanjanWidgets/TheJanjanWidgets.entitlements

  TheJanjanWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TheJanjanWatch
        excludes:
          - "TheJanjanWatch.entitlements"
      - path: TheJanjanWatch/TheJanjanWatch.entitlements
        buildPhase: none
    dependencies:
      - package: JanjanCore
    info:
      path: TheJanjanWatch/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "더잔잔"
        CFBundleDevelopmentRegion: "ko"
        CFBundlePackageType: "APPL"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thejanjan.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejanjan.app.watchkitapp
        PRODUCT_NAME: TheJanjanWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: TheJanjanWatch/TheJanjanWatch.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TheJanjanWatch/TheJanjanWatch.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TheJanjanWatch/TheJanjanWatch.entitlements

  # ── iOS UI 테스트 (화면 찍기) ──────────────────────────────────────────
  # 개발 머신에 맥이 없어 시뮬레이터를 눈으로 볼 수 없다. 이 타깃이 CI 의 macOS
  # 러너에서 앱을 띄우고 화면마다 사진을 찍어 첨부로 남긴다(screenshots.yml).
  # 평소 CI 에는 들어가지 않는다 — 느리고, 컴파일 확인은 단위 테스트로 충분하다.
  TheJanjanUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TheJanjanUITests
    dependencies:
      - target: TheJanjan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejanjan.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TheJanjan
        CODE_SIGN_STYLE: Automatic

  # ── iOS 단위 테스트 ────────────────────────────────────────────────────
  # 순수 로직 테스트는 Packages/JanjanCore 의 swift test 가 담당하고,
  # 여기서는 앱 계층(레코드 매핑·토큰 파싱)만 얇게 확인한다.
  TheJanjanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TheJanjanTests
    dependencies:
      - target: TheJanjan
      - package: JanjanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejanjan.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TheJanjan.app/TheJanjan"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic

# ── 화면 찍기 전용 스킴 ──────────────────────────────────────────────────
# UI 테스트를 기본 스킴에 넣지 않는 이유: 느리다. 평소 CI 는 컴파일과 단위 테스트만
# 보면 되고, 화면은 필요할 때 screenshots.yml 로 따로 부른다.
schemes:
  # 워치 앱을 따로 빌드해 시뮬레이터에 설치하려면 스킴이 필요하다.
  # watchOS 는 XCUITest 가 없어서 simctl 로 띄우고 찍는다.
  TheJanjanWatch:
    build:
      targets:
        TheJanjanWatch: all

  Screenshots:
    build:
      targets:
        TheJanjan: all
        TheJanjanUITests: [test]
    test:
      targets:
        - TheJanjanUITests
      gatherCoverageData: false
