# 트리거도 workflow_dispatch 뿐이라 자동으로는 절대 돌지 않는다.
# XcodeGen 으로 project.yml → TheJanjan.xcodeproj 를 만든 뒤,
# 아래 주석을 풀고 push 트리거(또는 태그 트리거)를 추가한다.
#
# 필요한 Secrets (App Store Connect API 키 방식):
#   ASC_KEY_ID           App Store Connect API 키 ID
#   ASC_ISSUER_ID        Issuer ID
#   ASC_PRIVATE_KEY      .p8 본문 (저장소에는 절대 커밋하지 않는다)
#   BUILD_CERT_P12       배포 인증서 .p12 를 base64 로 인코딩한 값
#   BUILD_CERT_PASSWORD  .p12 암호
#   PROVISIONING_PROFILE .mobileprovision 을 base64 로 인코딩한 값
#   KEYCHAIN_PASSWORD    러너에 만들 임시 키체인 암호

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      note:
        description: "TestFlight 빌드 메모 (선택)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Archive and upload
    runs-on: macos-14
    timeout-minutes: 60

    env:
      SCHEME: TheJanjan
      PROJECT: TheJanjan.xcodeproj
      CONFIGURATION: Release
      ARCHIVE_PATH: build/TheJanjan.xcarchive
      EXPORT_PATH: build/export

