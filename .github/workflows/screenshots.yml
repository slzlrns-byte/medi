# 더잔잔 — 화면 찍기
#
# 개발 머신에 맥이 없어 시뮬레이터를 눈으로 볼 수 없다. 이 워크플로가 macOS 러너에서
# 예시 기록을 심은 앱을 띄우고 화면마다 사진을 찍어, PNG 를 `ci/screenshots` 브랜치에
# 올린다. 아티팩트가 아니라 브랜치인 이유: 아티팩트 저장소(blob.core.windows.net)는
# 개발 환경의 네트워크 정책에 막혀 있고 git 은 뚫려 있다.
#
# 수동 실행만 한다. 느리고, 평소 CI 는 컴파일·단위 테스트만 보면 된다.
# 마지막 실행: 카드 여백을 좁히고, 좁은 기기(SE)와 바닥 컷을 새로 찍기 시작한 뒤.
#   볼 것 셋 - 폭이 넓어졌는지, 좁은 화면에서 잘리는 데가 있는지(-좁은화면),
#   바닥 카드가 탭 막대에 갇히지 않는지(01b·06b). (2026-09-01)

name: Screenshots

on:
  # workflow_dispatch 는 워크플로 파일이 기본 브랜치에 있어야 먹힌다.
  # 아직 main 에 없으므로, 그때까지는 작업 브랜치에 이 기계를 건드려 밀 때 돈다.
  # main 에 들어간 뒤로는 Actions 탭에서 손으로 부르면 된다.
  workflow_dispatch:
  # **이 워크플로가 가장 비싸다.** UI 테스트라 8분쯤 걸리고 macOS 는 10배 청구라
  # 한 번에 80분이 깎인다. 그래서 이 파일을 **일부러 건드릴 때만** 돈다.
  #
  # 앱 코드나 UI 테스트가 바뀌었다고 자동으로 돌지 않는다 — 그렇게 뒀더니
  # 화면을 볼 생각이 없는 커밋에서도 두 번 돌아 한도를 먹었다.
  # main 에 들어간 뒤로는 Actions 탭에서 손으로 부르면 된다.
  push:
    branches:
      - claude/local-work-app-integration-5fnhoc
    paths:
      - '.github/workflows/screenshots.yml'

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    name: 화면 찍기
    runs-on: macos-15
    # 실제로는 7~9분. 45분으로 두면 매달릴 때 450분이 깎인다.
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Xcode 선택 (latest-stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        run: xcodegen generate --spec project.yml

      - name: 시뮬레이터 두 대 고르기
        id: simulator
        # 넓은 기기 하나, 좁은 기기 하나.
        #
        # 예전에는 "그 런타임의 첫 번째 아이폰" 을 썼다. 우연히 402x874 짜리가
        # 잡혔고, 그 화면에서만 확인하다 보니 좁고 짧은 기기에서 무엇이 잘리는지
        # 알 수가 없었다. SE 는 375x667 로 27pt 좁고 179pt 짧다 - 넘치는 것은
        # 거기서 먼저 넘친다.
        run: |
          set -o pipefail
          xcrun simctl list devices available --json | python3 -c '
          import json, os, sys

          NARROW = ["iPhone SE (3rd generation)", "iPhone SE (2nd generation)",
                    "iPhone 13 mini", "iPhone 12 mini", "iPhone SE"]

          runtimes = json.load(sys.stdin)["devices"]

          def version(identifier):
              tail = identifier.rsplit(".", 1)[-1]
              parts = [p for p in tail.split("-") if p.isdigit()]
              return tuple(int(p) for p in parts) or (0,)

          newest, phones = None, []
          for identifier, devices in runtimes.items():
              if "iOS" not in identifier:
                  continue
              available = [d for d in devices
                           if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if not available:
                  continue
              if newest is None or version(identifier) > newest:
                  newest, phones = version(identifier), available

          if not phones:
              sys.exit("사용할 수 있는 iPhone 시뮬레이터가 없습니다.")

          def find(name):
              return next((d for d in phones if d["name"] == name), None)

          wide = phones[0]
          narrow = next((d for name in NARROW if (d := find(name))), None)

          lines = ["wide_udid=" + wide["udid"], "wide_name=" + wide["name"]]
          if narrow and narrow["udid"] != wide["udid"]:
              lines += ["narrow_udid=" + narrow["udid"], "narrow_name=" + narrow["name"]]
              sys.stderr.write("좁은 기기: {}\n".format(narrow["name"]))
          else:
              # 좁은 기기가 없으면 넓은 것만 찍는다. 사진이 아예 없는 것보다 낫다.
              lines += ["narrow_udid=", "narrow_name="]
              sys.stderr.write("좁은 기기를 못 찾았습니다. 넓은 기기만 찍습니다.\n")

          sys.stderr.write("넓은 기기: {}\n".format(wide["name"]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("\n".join(lines) + "\n")
          '

      - name: UI 테스트로 화면 찍기 (넓은 기기)
        run: |
          set -o pipefail
          xcodebuild \
            -project TheJanjan.xcodeproj \
            -scheme Screenshots \
            -destination "id=${{ steps.simulator.outputs.wide_udid }}" \
            -resultBundlePath build/wide.xcresult \
            -skipPackagePluginValidation \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: UI 테스트로 화면 찍기 (좁은 기기)
        # 좁은 기기가 실패해도 넓은 기기 사진은 이미 있다. 여기서 멈추지 않는다.
        if: always() && steps.simulator.outputs.narrow_udid != ''
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project TheJanjan.xcodeproj \
            -scheme Screenshots \
            -destination "id=${{ steps.simulator.outputs.narrow_udid }}" \
            -resultBundlePath build/narrow.xcresult \
            -skipPackagePluginValidation \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: 첨부에서 PNG 꺼내기
        # 테스트가 걸려 죽어도 이미 찍힌 것은 꺼낸다. 지난번에 이게 없어서
        # 25분 멈춘 뒤 찍어 둔 사진까지 통째로 잃었다.
        if: always()
        continue-on-error: true
        env:
          WIDE_NAME: ${{ steps.simulator.outputs.wide_name }}
          NARROW_NAME: ${{ steps.simulator.outputs.narrow_name }}
        run: |
          set -o pipefail
          mkdir -p build/named

          # 두 기기의 결과 꾸러미를 차례로 푼다. 좁은 기기 사진은 이름 뒤에
          # -좁은화면 을 붙여 한 폴더에 나란히 둔다 - 같은 화면을 위아래로
          # 놓고 봐야 무엇이 잘렸는지 보인다.
          for pass in wide narrow; do
            bundle="build/${pass}.xcresult"
            [ -d "$bundle" ] || { echo "$bundle 없음 - 건너뜁니다"; continue; }

            raw="build/raw-${pass}"
            mkdir -p "$raw"

            # Xcode 판에 따라 이 하위 명령이 없을 수 있다. 없으면 무엇이 있는지
            # 찍어 두고 멈춘다 - 조용히 빈 손으로 끝나면 왜 사진이 없는지 알 길이 없다.
            if ! xcrun xcresulttool export attachments --path "$bundle" --output-path "$raw"; then
              echo "::error::xcresulttool export attachments 가 실패했습니다($pass). 쓸 수 있는 하위 명령:"
              xcrun xcresulttool --help || true
              continue
            fi

            SUFFIX=""
            [ "$pass" = "narrow" ] && SUFFIX="-좁은화면"
            RAW="$raw" OUT=build/named SUFFIX="$SUFFIX" python3 - <<'PY'
          import json, os, shutil

          root = os.environ["RAW"]
          out = os.environ["OUT"]
          suffix = os.environ["SUFFIX"]
          os.makedirs(out, exist_ok=True)

          def copy(source, stem):
              shutil.copyfile(source, os.path.join(out, stem + suffix + ".png"))

          named = 0
          manifest_path = os.path.join(root, "manifest.json")

          # export 는 파일을 해시 이름으로 떨구고 manifest.json 에 원래 이름을 적어 둔다.
          # 사람이 읽을 이름으로 바꾸되, manifest 형식이 달라지면 이름만 포기하고
          # 사진은 건진다 - 이름 때문에 빈 손으로 끝나는 것이 가장 나쁘다.
          if os.path.exists(manifest_path):
              try:
                  with open(manifest_path, encoding="utf-8") as handle:
                      manifest = json.load(handle)
                  entries = manifest if isinstance(manifest, list) else [manifest]
                  for test in entries:
                      for attachment in (test or {}).get("attachments", []):
                          exported = attachment.get("exportedFileName")
                          if not exported:
                              continue
                          source = os.path.join(root, exported)
                          if not os.path.exists(source):
                              continue
                          label = (
                              attachment.get("suggestedHumanReadableName")
                              or attachment.get("name")
                              or exported
                          )
                          copy(source, os.path.splitext(label)[0])
                          named += 1
              except Exception as error:
                  print("manifest 를 읽지 못했습니다:", error)

          if named == 0:
              for entry in sorted(os.listdir(root)):
                  if entry.lower().endswith(".png"):
                      copy(os.path.join(root, entry), os.path.splitext(entry)[0])
                      named += 1

          print("{} 사진 {}장".format(root, named))
          PY
          done

          ls -la build/named
          test "$(ls build/named/*.png 2>/dev/null | wc -l)" -gt 0 \
            || { echo "::error::사진을 하나도 꺼내지 못했습니다."; exit 1; }

          echo "넓은 기기: ${WIDE_NAME:-?} / 좁은 기기: ${NARROW_NAME:-없음}"

      # ── 워치 ────────────────────────────────────────────────────────────
      # watchOS 는 XCUITest 를 지원하지 않는다. 눌러 가며 찍을 수 없으므로
      # simctl 로 앱을 띄우되 어느 화면으로 열지는 실행 인자로 고른다.
      #
      # 아래 세 단계는 실패해도 멈추지 않는다(continue-on-error). 워치가 안 되더라도
      # 이미 찍은 아이폰 사진은 올려야 한다 — 빈 손으로 끝나는 것이 가장 나쁘다.

      - name: 워치 시뮬레이터 고르기
        id: watch
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          runtimes = json.load(sys.stdin)["devices"]

          def version(identifier):
              tail = identifier.rsplit(".", 1)[-1]
              parts = [p for p in tail.split("-") if p.isdigit()]
              return tuple(int(p) for p in parts) or (0,)

          best = None
          for identifier, devices in runtimes.items():
              if "watchOS" not in identifier:
                  continue
              watches = [d for d in devices if d.get("isAvailable") and "Apple Watch" in d["name"]]
              if not watches:
                  continue
              candidate = (version(identifier), identifier, watches[0])
              if best is None or candidate[0] > best[0]:
                  best = candidate

          if best is None:
              sys.exit("사용할 수 있는 Apple Watch 시뮬레이터가 없습니다.")

          sys.stderr.write("고른 기기: {} ({})\n".format(best[2]["name"], best[1]))
          print(best[2]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 워치 앱 빌드
        if: always() && steps.watch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project TheJanjan.xcodeproj \
            -scheme TheJanjanWatch \
            -destination "id=${{ steps.watch.outputs.udid }}" \
            -derivedDataPath build/watch-dd \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 워치 화면 찍기
        if: always() && steps.watch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          UDID="${{ steps.watch.outputs.udid }}"
          BUNDLE="com.thejanjan.app.watchkitapp"

          APP=$(find build/watch-dd/Build/Products -name 'TheJanjanWatch.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::빌드된 워치 앱을 찾지 못했습니다."
            find build/watch-dd/Build/Products -maxdepth 2 -type d || true
            exit 1
          fi
          echo "앱: $APP"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          mkdir -p build/named

          # 한 화면이 실패해도 나머지는 찍는다. 여기서 죽으면 세 장을 다 잃는데,
          # 워치 사진은 한 번 찍는 데 macOS 러너 몇 분이 든다.
          capture () {
            name="$1"; screen="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            if ! xcrun simctl launch "$UDID" "$BUNDLE" -JanjanSeedDemoData -JanjanScreen "$screen"; then
              echo "::warning::${name} 을 띄우지 못했습니다. 다음 화면으로 넘어갑니다."
              return 0
            fi
            # 화면이 자리를 잡을 틈. 워치는 폰보다 느리게 뜨고,
            # 시트는 뜬 뒤에 한 박자 늦게 올라온다.
            sleep 6
            xcrun simctl io "$UDID" screenshot "build/named/${name}.png" \
              || echo "::warning::${name} 을 찍지 못했습니다."
          }

          # 설치 직후 첫 실행은 느리다. 그 느린 실행이 첫 사진이 되지 않도록
          # 한 번 버리고 시작한다.
          xcrun simctl launch "$UDID" "$BUNDLE" -JanjanSeedDemoData >/dev/null 2>&1 || true
          sleep 8

          capture "11-워치-홈" home
          capture "12-워치-기분" mood
          capture "13-워치-증상" symptom

          ls -la build/named

      - name: ci/screenshots 브랜치에 올리기
        if: always()
        run: |
          set -e

          # 한 장도 못 찍었으면 브랜치를 건드리지 않는다. 지난 사진을 빈 것으로
          # 덮어쓰면 그나마 있던 것도 잃는다.
          if ! ls build/named/*.png >/dev/null 2>&1; then
            echo "::warning::찍힌 사진이 없어 브랜치를 그대로 둡니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/shots
          cp build/named/*.png /tmp/shots/

          git checkout --orphan screenshots-tmp
          git rm -rf --cached . > /dev/null
          rm -rf shots
          mkdir -p shots
          cp /tmp/shots/*.png shots/

          {
            echo "# 시뮬레이터 화면"
            echo
            echo "\`screenshots.yml\` 이 macOS 러너에서 찍어 올린 것입니다. 손으로 고치지 마세요."
            echo
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo "- 찍은 때: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > README.md

          git add -f shots README.md
          git commit -q -m "화면 ${GITHUB_SHA:0:7}"
          git push -f origin HEAD:ci/screenshots
